services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENABLE_INTERNAL_SCHEDULERS: "false"
      ENABLE_SCHEDULER: "false"
      ENABLE_BACKFILL_SCHEDULER: "false"
      BOOTSTRAP_SYNC: "false"
      WEBHOOK_ENRICHMENT_ENABLED: "false"
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
    volumes:
      - ${APP_DATA_DIR:-/var/lib/tro-case-watch/data}:/app/data
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4127/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PORT: "4128"
      ENABLE_INTERNAL_SCHEDULERS: "true"
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=1280}
    volumes:
      - ${APP_DATA_DIR:-/var/lib/tro-case-watch/data}:/app/data
    mem_limit: 2500m
    mem_reservation: 512m
    cpus: 0.75
    pids_limit: 192
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4128/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
